# Local LAN name for Jellyfin: http://kino.local (mDNS name published by avahi on the Pi)
server {
    listen 80;
    server_name kino.local;

    client_max_body_size 20M;

    location / {
        proxy_pass http://host.docker.internal:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # WebSocket (Jellyfin live updates / SyncPlay)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Streaming: don't buffer video
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/kino.local.access.log;
    error_log /var/log/nginx/kino.local.error.log;
}
