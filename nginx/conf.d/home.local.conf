# Home Assistant for the home network only: http://home.local (mDNS name published by kino-mdns on the Pi).
# HA runs on the host network (port 8123, itself firewalled to the LAN by host/ha-lan-only.sh).
server {
    listen 80;
    server_name home.local;

    # LAN over IPv4 keeps the client address; LAN IPv6 (ULA) arrives via Docker's proxy from a bridge
    # gateway (172.16/12). Anything coming through the Cloudflare tunnel is refused.
    allow 192.168.178.0/24;
    allow 172.16.0.0/12;
    deny all;
    if ($http_cf_connecting_ip) { return 403; }

    client_max_body_size 50M;   # backup uploads

    location / {
        proxy_pass http://host.docker.internal:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HA's frontend lives on a websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    access_log /var/log/nginx/home.local.access.log;
    error_log /var/log/nginx/home.local.error.log;
}
