version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    # IPv4 only. Over IPv6 Docker's userland proxy would hide the client's address behind a bridge
    # gateway, and the LAN-only vhosts (logs.local, home.local) could not tell LAN from internet.
    # IPv6 clients get an instant refusal and fall back to IPv4.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/var/www/html:ro
      - ./nginx/logs:/var/log/nginx
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nginx-network
      - monitoring   # to reach grafana:3000 for logs.local

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - nginx-network

networks:
  nginx-network:
    driver: bridge
  monitoring:
    external: true
    name: home-media-server_monitoring