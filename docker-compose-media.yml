version: '3.8'

services:
  jellyfin:
    # Pinned on purpose: major upgrades run one-way DB migrations — back up jellyfin/config first.
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      # Transcode segments go to the HDD, not the SD card (SD write stalls froze the whole Pi).
      # Encoding settings point TranscodingTempPath here.
      - type: bind
        source: /mnt/media/_Transcodes
        target: /transcodes
        bind:
          create_host_path: false
      - /mnt/media:/media:rw
    environment:
      - JELLYFIN_PublishedServerUrl=http://192.168.178.99:8096
      - TZ=Europe/Berlin
    networks:
      - media-network
    devices:
      - /dev/dri:/dev/dri # For hardware acceleration (if available)

networks:
  media-network:
    driver: bridge

volumes:
  media:
    driver: local
