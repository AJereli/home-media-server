# Home Assistant at http://home.local:8123 (http://home.local redirects there), LAN only:
#   - host firewall host/ha-lan-only.sh: HA ports reachable from loopback, 192.168.178.0/24
#     and LAN IPv6 (ULA/link-local) only
#   - no reverse proxy, so HA sees real client addresses and trusts no X-Forwarded-For
# No Nabu Casa / remote access. Everything else is configured in the UI.

default_config:

# HTTP settings (IP ban, login attempts threshold) live in the UI since 2026.11:
# Settings → System → Network. A YAML http: block is only imported on the very first start.

# The SD card is slow and wears out: write history every 30 s, keep 7 days (long-term trends live in Prometheus).
recorder:
  commit_interval: 30
  purge_keep_days: 7

logger:
  default: warning

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
