# /etc/systemd/zram-generator.conf — swap in compressed RAM instead of /var/swap on the SD card.
# Half of the RAM (2 GB max) as a zstd-compressed swap device; typically ~3:1, so this rarely costs
# more than ~700 MB of real memory even when full.
[zram0]
zram-size = min(ram / 2, 2048)
compression-algorithm = zstd
swap-priority = 100
