# http://home.local → Home Assistant on port 8123 (mDNS name published by kino-mdns on the Pi).
# No proxying on purpose: HA talks to clients directly, so it sees their real address (IP ban works, nothing
# to trust in X-Forwarded-For), and port 8123 is firewalled to the LAN by host/ha-lan-only.sh.
server {
    listen 80;
    server_name home.local;

    allow 192.168.178.0/24;
    deny all;

    return 301 http://home.local:8123$request_uri;

    access_log /var/log/nginx/home.local.access.log;
    error_log /var/log/nginx/home.local.error.log;
}
