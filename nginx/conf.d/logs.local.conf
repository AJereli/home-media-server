# Grafana for the home network only: http://logs.local (mDNS name published by kino-mdns on the Pi).
server {
    listen 80;
    server_name logs.local;

    # LAN over IPv4 keeps the client address. Over IPv6 (ULA) Docker's proxy hands the request on
    # from the bridge gateway (172.16/12). Anything arriving through the Cloudflare tunnel is refused.
    allow 192.168.178.0/24;
    allow 172.16.0.0/12;
    deny all;
    if ($http_cf_connecting_ip) { return 403; }

    # Resolve at request time: if Grafana is down nginx still starts (kino.local and the site keep working).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $grafana http://grafana:3000;

    location / {
        proxy_pass $grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live (websocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    access_log /var/log/nginx/logs.local.access.log;
    error_log /var/log/nginx/logs.local.error.log;
}
