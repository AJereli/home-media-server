global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  # Runs on the host network, listening on docker0 only.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['172.17.0.1:9100']
        labels:
          instance: 'raspberrypi'

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Add more services here as you deploy them
  # Example for future services:
  # - job_name: 'my-app'
  #   static_configs:
  #     - targets: ['my-app:8080']